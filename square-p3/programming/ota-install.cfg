# Initial application-core OTA provisioning only. Run AFTER backup and audit.
# This erases application code/update slots 0x00000..0xf0fff, then installs
# MCUboot + confirmed app 1.0.0. Network flash/UICR/storage are not written.
if {![info exists ::env(NORA_EXPECT_DEVICE_ID)]} {
    error "Set NORA_EXPECT_DEVICE_ID to the backed-up target's full device ID."
}
if {![file exists build/square-p3-ble-ota/dist/nora-ota-1.0.0.factory.hex]} {
    error "Build and validate OTA 1.0.0 before installation."
}
init
targets nrf53.cpuapp
poll
halt 3000
set identity [read_memory 0x00ff0204 32 3]
set actual [format "%08x-%08x" [lindex $identity 0] [lindex $identity 1]]
if {$actual ne $::env(NORA_EXPECT_DEVICE_ID) || [lindex $identity 2] != 0x5340} {
    error "Device identity mismatch: found $actual. No erase/programming performed."
}
reset halt
mww 0x50005614 1
flash erase_address 0x00000000 0xf1000
flash write_image build/square-p3-ble-ota/dist/nora-ota-1.0.0.factory.hex
verify_image build/square-p3-ble-ota/dist/nora-ota-1.0.0.factory.hex
reset run
shutdown
