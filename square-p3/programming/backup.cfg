# Read-only original-module backup. Run from the repository root with
# NORA_BACKUP_DIR naming an existing empty directory unique to this module.
# Halts/resets cores and changes runtime debug registers, but never writes
# flash/UICR or requests recovery/erase.
if {![info exists ::env(NORA_BACKUP_DIR)]} {
    error "Set NORA_BACKUP_DIR to a new, empty per-board backup directory."
}
set backup_dir $::env(NORA_BACKUP_DIR)
if {![file isdirectory $backup_dir]} {
    error "Create NORA_BACKUP_DIR first; use a new directory for each module."
}
foreach name {device-id.txt app-flash.bin app-uicr.bin app-ficr.bin net-flash.bin net-uicr-documented.bin net-ficr.bin} {
    if {[file exists [file join $backup_dir $name]]} {
        error "Backup file already exists: $name. Refusing to overwrite it."
    }
}

init
targets nrf53.cpuapp
poll
halt 3000
set identity [read_memory 0x00ff0204 32 3]
if {[lindex $identity 2] != 0x00005340} {
    error "Unexpected part code; expected nRF5340. No backup or programming performed."
}
set device_id [format "%08x-%08x" [lindex $identity 0] [lindex $identity 1]]
echo "Backing up module $device_id"
set id_file [open [file join $backup_dir device-id.txt] w]
puts $id_file $device_id
close $id_file
dump_image [file join $backup_dir app-flash.bin] 0x00000000 0x100000
dump_image [file join $backup_dir app-uicr.bin] 0x00ff8000 0x1000
dump_image [file join $backup_dir app-ficr.bin] 0x00ff0000 0x1000

nrf53_cpunet_release nrf53
targets nrf53.cpunet
poll
halt 3000
dump_image [file join $backup_dir net-flash.bin] 0x01000000 0x40000
dump_image [file join $backup_dir net-uicr-documented.bin] 0x01ff8000 0x380
dump_image [file join $backup_dir net-ficr.bin] 0x01ff0000 0x400
# Clear the debugger's reset trap/halt request before normal target startup.
mww 0xe000edfc 0
resume
targets nrf53.cpuapp
mww 0x50005614 1
reset run
echo "Backup complete for $device_id. Verify file sizes and hashes before flashing."
shutdown
