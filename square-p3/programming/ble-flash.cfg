# Run from the repository root AFTER building/auditing both BLE images and
# backing up both cores. Writes code flash only, never UICR or mass erase.
init
targets nrf53.cpuapp
reset halt
nrf53_cpunet_release nrf53
targets nrf53.cpunet
poll
halt 3000
flash write_image erase build/square-p3-ble/net/zephyr/zephyr.hex
verify_image build/square-p3-ble/net/zephyr/zephyr.hex
# Clear the programmer's network-core reset trap and halt request before
# holding that core off. A running network core can stall application flash
# programming; a leftover halt request can prevent subsequent IPC startup.
mww 0xe000edfc 0
resume
targets nrf53.cpuapp
mww 0x50005614 1
flash write_image erase build/square-p3-ble/app/zephyr/zephyr.hex
verify_image build/square-p3-ble/app/zephyr/zephyr.hex
reset run
shutdown
