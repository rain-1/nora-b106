# Raspberry Pi Pico running the official debugprobe_on_pico firmware.
# Target is externally powered at 3.3 V logic. Start slowly with jumper wires.
source [find interface/cmsis-dap.cfg]
transport select swd
if {[catch {find target/nordic/nrf53.cfg} nrf53_config]} {
    set nrf53_config [find target/nrf53.cfg]
}
source $nrf53_config
adapter speed 1000
