# Bench smoke test for this breakout's P0.20 LED using SWD register writes.
# No flash/UICR programming, erase, recover, or firmware image is required.
# Requires unlocked secure application-core debug access and populated D1/R3.
init
targets nrf53.cpuapp
halt
# FICR INFO.DEVICEID[0..1] and INFO.PART, from Nordic MDK v3.2.0.
echo "Application device ID and part code:"
mdw 0x00FF0204 3
# P0 secure alias 0x50842500, PIN_CNF[20] offset 0x250.
set old_cfg [lindex [read_memory 0x50842750 32 1] 0]
set old_out [lindex [read_memory 0x50842504 32 1] 0]
# DIR=output, INPUT=disconnect, no pull, standard drive, GPIO ownership.
mww 0x50842750 0x00000003
for {set i 0} {$i < 6} {incr i} {
    mww 0x50842508 0x00100000
    sleep 300
    mww 0x5084250c 0x00100000
    sleep 300
}
if {[expr {$old_out & 0x00100000}]} {
    mww 0x50842508 0x00100000
} else {
    mww 0x5084250c 0x00100000
}
mww 0x50842750 $old_cfg
echo "LED test finished; core remains halted. Power-cycle to restart it."
shutdown
